# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   (số từ src/lab13.py, hàm co_mau và m_toi_thieu)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 1.251 × 2,48 = 3.103 mỗi nhóm → 42 người mỗi nhóm, tổng 84 > 40: không đủ người
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa c / ICC = 20 / 0,02 = 1.000 < 1.251: không đạt
#   d) 6 depot mỗi nhóm: tối đa 6 / 0,02 = 300, chỉ 6 cụm < 20: loại
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m ≥ 299 yêu cầu mỗi người (DE = 6,96); nếu tác động thật chỉ 5 điểm thì power ≈ 0,64
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có. 20 nhân viên đối chứng tự làm cùng tuần, cùng depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên. Bốc thăm bằng code với seed ghi trước, phân tầng theo depot; trưởng nhóm không được chọn người.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên đối chứng xin câu trả lời của đồng nghiệp cùng depot; giảm bằng quyền truy cập theo tài khoản và log assistant_opened theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có. Chỉ số chính, MDE 6 điểm, luật dừng và ngày 2027-01-12 chốt trước ngày bắt đầu 2026-12-07.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Với 40 nhân viên, không cách chia theo cụm nào đủ mẫu cho mức chênh 5 điểm (tối đa 1.000 < 1.251).
#   Nhóm chọn chia theo nhân viên 20/20 để tách được tác động, và chấp nhận MDE 6 điểm (859 mỗi nhóm, m ≥ 299).
#   Cái giá: nếu tác động thật chỉ 5 điểm thì power chỉ ≈ 0,64, tức khoảng 1/3 khả năng bỏ sót. Giám đốc vận hành phải ký chấp nhận.
#   20 + 20 cần cả 40 nhân viên của 12 depot, trong khi đợt chạy thử chỉ có 6 depot (20 nhân viên). 20 người ở 6 depot mới chưa từng dùng
#   trợ lý, nên bốc thăm phân tầng theo depot (mỗi depot chia đều hai nhóm) để nhóm trợ lý và đối chứng có cùng tỉ lệ người đã quen trợ lý.
#   m ≥ 299: phạm vi noi_dia + hang_nang ≈ 1.500 × 982/1.200 ÷ 40 ≈ 30 yêu cầu/người/ngày → khoảng 10 ngày; nhóm đo 14 ngày cho dư.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn: hiện tại 4,25% (51/1.200), trong phạm vi noi_dia + hang_nang 3,97% (39/982); ngưỡng: so với đối chứng, dừng khi nhóm trợ lý cao hơn ≥ 2 điểm, kèm trần tuyệt đối 6%. Không đặt 3% tuyệt đối vì mức hiện tại đã 3,97%, pilot sẽ dừng ngay tuần đầu.
#
# Lịch: 2026-12-07 bắt đầu bước 0.10 (4 người) · 2026-12-14 bước 0.25 (10 người) · 2026-12-21 bước 0.50 (20 người), bắt đầu đo chỉ số chính
#       2026-12-21 → 2027-01-03 đo 14 ngày · 2027-01-10 hết cửa sổ mở lại 7 ngày của yêu cầu cuối · 2027-01-12 họp quyết định.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22× và 0,69× so với 12.000 đ, simulated) ở cả 12 depot (40 nhân viên; đợt chạy thử chỉ có 6 depot D01–D06 với 20 nhân viên, không đủ cho 20 + 20); loại quoc_te (1,88×, thành công 27,3%, chạy lại không giúp) và doi_tac (0,85×, điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần; 4 → 10 → 20 nhân viên nhóm trợ lý; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 5 điểm không đủ mẫu với 40 nhân viên
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96           # 1 + (299 − 1) × 0,02
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng tự làm cùng thời gian, cùng depot, phân tầng theo depot"
    spillover_risk: "Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời; giảm bằng quyền truy cập theo tài khoản, log assistant_opened theo staff_id, loại khỏi phân tích nhân viên đối chứng có lượt mở trợ lý"
    predeclared: "Có: chỉ số chính, MDE 6 điểm, n 859 mỗi nhóm, luật dừng và ngày quyết định 2027-01-12 chốt trước ngày bắt đầu 2026-12-07"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng ≥ 2 điểm hoặc vượt 6% (hiện tại 3,97% trong phạm vi), hoặc có ≥ 1 ca hoàn trùng trong ledger_refund_posted TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và Kỹ sư trưởng agent rà toàn bộ trace liên quan KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công của nhóm trợ lý, chỉ tính token + tool + xem lại + làm lại và chưa cộng chi phí cố định 40 triệu đ/tháng, > 8.000 đ (đợt chạy thử 3.414 đ trong phạm vi, simulated) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở lại hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) > 40% (đợt chạy thử 27,12%) TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên nhóm trợ lý trong 3 ngày và báo cáo lý do KHÔNG THÌ không được chuyển bước rollout"
    - "NẾU thời gian xem lại trung bình mỗi gợi ý > 4,8 phút (hoà vốn khi xem lại 100% là 4,8 phút nếu làm lại 15,3 phút/ca như dữ liệu, 5,1 phút nếu 9 phút/ca; nhóm lấy kịch bản xấu hơn, simulated; đặt lại theo phút đo thật sau tuần 1) TRONG 2 tuần liên tiếp THÌ Trưởng nhóm CSKH cùng PM trợ lý hoàn phí rà quy trình xem lại KHÔNG THÌ không được giảm tỉ lệ xem lại theo bậc"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; Kỹ sư trưởng agent xác nhận đã tắt; khách được phục vụ bằng luồng nhân viên tự làm như nhóm đối chứng"
  decision_date: "2027-01-12"
